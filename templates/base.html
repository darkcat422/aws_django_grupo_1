{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">


    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Django Project</title>
</head>
<body class="bg-light">
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container-fluid">
                <!-- Logo -->

                <!-- Menú -->
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <!--url para home-->
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Home</a>
                        </li>
                        
                        <!--url para listado de posts crud-->
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'lista_posts' %}">Listado de BLOG</a>
                        </li>

                        <!--url para perfil de usuario-->
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'perfil_usuario' %}">Perfil</a>
                        </li>

                    </ul>


                    <!-- Usuario autenticado o no -->
                    {% if user.is_authenticated %}
                    <ul class="navbar-nav d-flex">
                        <li class="nav-item">
                            <div class="container-fluid">
                                <span class="navbar-text">
                                    {{ user.username }}
                                </span>
                            </div>
                        </li>
                        <li class="nav-item">
                            <!--url para salir sesion-->
                            <form method="post" action="{% url 'logout' %}" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-link nav-link p-0">Cerrar sesión</button>
                            </form>
                            </li>

                    </ul>
                    {% else %}
                    <ul class="navbar-nav d-flex">
                        <li class="nav-item">
                            <!-- url para cerrar sesion del usuario-->
                            <a class="btn btn-primary" href="{% url 'login' %}" role="button">Iniciar sesión</a>
                        </li>
                    </ul>

                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido dinámico -->
    <main class="container mt-4">
        {% block content %}{% endblock content %}
    </main>

    <!-- Footer -->
    <footer class="container-fluid text-bg-dark text-center p-3 mt-5">
        <p class="mb-0">© Sitio desarrollado con Django</p>
    </footer>



</body>
</html>
